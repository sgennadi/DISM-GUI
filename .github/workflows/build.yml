name: DISM GUI - VS2026 x86 x64 ARM64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest push build; obsolete queued builds must not block the release.
concurrency:
  group: dism-gui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x86, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Pre-build diagnostics
        run: python tools/prebuild_check.py
      - name: Validate automated CI analyzer
        if: matrix.rid == 'win-x64'
        run: python -m unittest discover -s tests -p test_ci_analysis.py
      - name: Test DISM image command quoting
        if: matrix.rid == 'win-x64'
        run: python -m unittest discover -s tests -p test_dism_image_commands.py
      - name: Prepare modernized DISM GUI source
        run: python tools/prepare_source.py
      - name: Check patch
        shell: pwsh
        run: |
          python -c "from pathlib import Path; s=Path('DISM GUI/frmMain.vb').read_text(encoding='utf-8-sig'); assert 'ChooseFolderModern(' in s and 'ShowUnmountResult(' in s; assert s.count(' /Index:') >= 4; assert '/index:' + chr(34)*3 not in s; print('Patched source OK')"
      - name: Smoke-test WinForms and real read-only WIM mount (x64)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          DISMGUI_TEST_WIM_MOUNT: '1'
          DISMGUI_TEST_LARGE_WIM: '1'
        run: dotnet run --project tests/LayoutSmoke/LayoutSmoke.csproj --configuration Release -p:Platform=AnyCPU
      - name: Simulate GUI font scaling at 125%, 150%, and 175% (x64)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $env:DISMGUI_LAYOUT_ONLY = '1'
          foreach ($scale in @('1.25', '1.50', '1.75')) {
            $env:DISMGUI_LAYOUT_FONT_SCALE = $scale
            Write-Host "Running WinForms font-layout stress at simulated $scale scale"
            dotnet run --project tests/LayoutSmoke/LayoutSmoke.csproj --configuration Release --no-build -p:Platform=AnyCPU
            if ($LASTEXITCODE -ne 0) {
              throw "WinForms layout smoke failed at font-scale $scale"
            }
          }
      - name: Upload WinForms layout screenshots (x64)
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: DISMGUI-UI-Layout-Preview
          path: ui-screenshots/*.png
          if-no-files-found: warn
      - name: Publish portable EXE
        shell: pwsh
        run: ./Build.ps1 -Runtime '${{ matrix.rid }}' -SkipPrepare
      - name: Verify embedded EXE icon and no PDB/config clutter
        shell: pwsh
        run: |
          python tools/verify_icon.py "DISM GUI/App.ico" "artifacts/${{ matrix.rid }}/DISM GUI.exe"
          $badFiles = @(Get-ChildItem -LiteralPath "artifacts/${{ matrix.rid }}" -File | Where-Object {
            $_.Extension -ieq '.pdb' -or
            $_.Name -ieq 'DISM GUI.dll.config' -or
            $_.Name -ieq 'DISM GUI.exe.config'
          })
          if ($badFiles.Count -ne 0) { throw "Unexpected debug/config files in portable package" }
      - uses: actions/upload-artifact@v7
        with:
          name: DISMGUI-VS2026-${{ matrix.rid }}
          path: artifacts/DISMGUI-VS2026-${{ matrix.rid }}.zip
          if-no-files-found: error

  stable-release:
    name: Publish verified stable release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all three portable ZIPs
        uses: actions/download-artifact@v7
        with:
          pattern: DISMGUI-VS2026-*
          path: dist
          merge-multiple: true
      - name: Verify release artifacts and compute SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          for rid in win-x86 win-x64 win-arm64; do
            zip="dist/DISMGUI-VS2026-$rid.zip"
            test -s "$zip"
            unzip -Z1 "$zip" | grep -Fxq 'DISM GUI.exe'
            if unzip -Z1 "$zip" | grep -Ei '\.pdb$|DISM GUI\.(dll|exe)\.config$'; then
              echo "Unexpected debug symbols or legacy config in $zip" >&2
              exit 1
            fi
          done
          (cd dist && sha256sum DISMGUI-VS2026-*.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Check if this version is already published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. Publishing from latest successful source only."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          elif gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists; leaving its assets unchanged."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          fi
      - name: Publish stable release with x86, x64 and ARM64 files
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${RELEASE_VERSION}" \
            dist/DISMGUI-VS2026-win-x86.zip \
            dist/DISMGUI-VS2026-win-x64.zip \
            dist/DISMGUI-VS2026-win-arm64.zip \
            dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "DISM GUI v${RELEASE_VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest

  rc-release:
    name: Publish DISM GUI 4.3.10 RC1
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/gui-readability-4.3.9-rc1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download verified Windows ZIPs
        uses: actions/download-artifact@v7
        with:
          pattern: DISMGUI-VS2026-win-*
          path: dist
          merge-multiple: true
      - name: Verify RC version, archives and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "4.3.10"
          for rid in win-x86 win-x64 win-arm64; do
            zip="dist/DISMGUI-VS2026-$rid.zip"
            test -s "$zip"
            unzip -Z1 "$zip" | grep -Fxq 'DISM GUI.exe'
          done
          test -s RC_RELEASE_NOTES.md
          (cd dist && sha256sum DISMGUI-VS2026-win-*.zip > SHA256SUMS.txt)
      - name: Publish GitHub pre-release without changing stable 4.3.9
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v4.3.10-rc.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "RC1 already published, preserving its artifacts."
            exit 0
          fi
          gh release create "$tag" \
            dist/DISMGUI-VS2026-win-x86.zip \
            dist/DISMGUI-VS2026-win-x64.zip \
            dist/DISMGUI-VS2026-win-arm64.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.pull_request.head.sha }}" \
            --title "DISM GUI 4.3.10 RC1" \
            --notes-file RC_RELEASE_NOTES.md \
            --prerelease
