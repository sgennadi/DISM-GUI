name: Signed OEM / WIM test on hosted Windows VM

on:
  pull_request:
    paths:
      - '.github/workflows/oem-windows-vm.yml'
      - 'tests/RealOemIntegration/**'
      - 'tools/DriverStudio*.vb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-ephemeral-vm:
    name: Validate signed OEM prerequisites on Windows VM
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare DISM GUI source
        run: python tools/prepare_source.py
      - name: Probe VM and run copy-only signed OEM servicing when supported
        shell: pwsh
        run: ./tests/RealOemIntegration/Invoke-VirtualMachineValidation.ps1 -ReportDirectory oem-vm-report
      - name: Upload media availability and validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Signed-OEM-WIM-VM-Validation
          path: oem-vm-report/oem-vm-result.json
          if-no-files-found: warn
